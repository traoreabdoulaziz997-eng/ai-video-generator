<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Générateur de vidéos IA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="conteneur">

        <section class="carte">

            <h1>🎬 Générateur de vidéos IA</h1>

            <p class="description">
                Décris la vidéo que tu souhaites créer.
            </p>

            <textarea
                id="prompt"
                placeholder="Exemple : Une ville futuriste la nuit, vue depuis le ciel...">
            </textarea>

            <button onclick="genererVideo()">
                🎬 Générer la vidéo
            </button>

            <p id="statut"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
